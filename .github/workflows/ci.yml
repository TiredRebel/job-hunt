name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  scraper:
    name: services/scraper (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scraper
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src
      - run: uv run pytest -q

  llm:
    name: services/llm (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/llm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src
      - run: uv run pytest -q

  e2e:
    name: apps/web e2e (Playwright happy path)
    runs-on: ubuntu-latest
    # TODO(phase-7-hardening): remove continue-on-error once this job has
    # proven stable across a handful of real CI runs (see design.md Risks —
    # this is the flakiest, most infra-heavy job: a fresh Postgres, two
    # natively-started Python services, and a native gateway, none of which
    # could be verified against a real GitHub Actions runner while writing
    # this workflow). A failure here must stay visible in the run summary
    # even while non-blocking, not silently green.
    continue-on-error: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobhunter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/jobhunter?sslmode=disable
      DBMATE_MIGRATIONS_DIR: ./infra/db/migrations
      DBMATE_SCHEMA_FILE: ./infra/db/schema.sql
      SCRAPER_BASE_URL: http://localhost:8001
      LLM_BASE_URL: http://localhost:8002
      API_URL: http://localhost:4000/v1
      NEXT_PUBLIC_API_URL: http://localhost:4000/v1
      INTERNAL_API_TOKEN: ci-e2e-internal-token-not-a-real-secret-0123456789
      WEB_ORIGIN: http://localhost:3000
      LOG_LEVEL: info
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python service dependencies
        run: |
          (cd services/llm && uv sync --locked)
          (cd services/scraper && uv sync --locked)

      - name: Run migrations and seed the minimum happy-path data
        # Not `npm run db:seed`: that script is hardcoded to
        # `docker exec pg-learn` (this dev's local Postgres container name),
        # which doesn't exist here — Postgres is the `postgres` service
        # container above, reachable via $DATABASE_URL. Runs the same
        # infra/db/seed.sql directly against it instead.
        run: |
          npm run db:up
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/db/seed.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            INSERT INTO core.jobs (source_id, external_id, url, title, description_md)
            SELECT id, 'ci-e2e-seed-1', 'https://jobs.dou.ua/ci-e2e-1', 'CI E2E Seed Job',
                   'Seed row for the e2e happy path.'
            FROM core.sources WHERE slug = 'dou'
            ON CONFLICT (source_id, external_id) DO NOTHING;"

      - name: Start scraper + LLM services (native, Linux — see DEPLOYMENT.md §8.2)
        run: |
          (cd services/llm && nohup uv run uvicorn llm.main:app --port 8002 > /tmp/llm.log 2>&1 &)
          (cd services/scraper && nohup uv run uvicorn scraper.main:app --port 8001 > /tmp/scraper.log 2>&1 &)

      - name: Wait for scraper + LLM health
        run: |
          for url in http://localhost:8001/health http://localhost:8002/health; do
            for _ in $(seq 1 30); do
              if curl -sf "$url" > /dev/null; then break; fi
              sleep 2
            done
            curl -sf "$url" > /dev/null || { echo "$url never became healthy"; cat /tmp/scraper.log /tmp/llm.log; exit 1; }
          done

      - name: Start the API gateway (native)
        run: nohup npm run dev -w apps/api > /tmp/api.log 2>&1 &

      - name: Wait for gateway health
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:4000/v1/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:4000/v1/health > /dev/null || { echo "gateway never became healthy"; cat /tmp/api.log; exit 1; }

      - name: Install Playwright browsers
        # Not `npm run test:e2e:install` (`playwright install chromium`):
        # a bare CI runner also needs the OS-level shared libraries Chromium
        # depends on, which only `--with-deps` installs via apt.
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        working-directory: apps/web
        run: npm run test:e2e

      - name: Dump service logs on failure
        # Wait-for-health only proves the process is listening, not that it
        # can serve real requests (e.g. the gateway's health check never
        # touches Postgres) — so a request-time failure like a DB error is
        # otherwise invisible: it only lands in /tmp/*.log, which nothing
        # else prints. Surface it whenever the e2e step didn't succeed.
        if: failure()
        run: |
          echo "::group::api.log"
          cat /tmp/api.log || true
          echo "::endgroup::"
          echo "::group::scraper.log"
          cat /tmp/scraper.log || true
          echo "::endgroup::"
          echo "::group::llm.log"
          cat /tmp/llm.log || true
          echo "::endgroup::"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
