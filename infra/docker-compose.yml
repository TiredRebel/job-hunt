# Job Hunter — local infra
#
# NOT started here (already running on this machine):
#   - Postgres 17: container `pg-learn` @ localhost:5432  → create database `jobhunter` in it
#   - n8n:         container `n8n-n8n-1` @ localhost:5678
#
# This file adds only what's missing. Services connect to the host's
# Postgres/n8n via host.docker.internal.
#
# `redis` starts by default (`docker compose up -d`). `scraper`/`llm`/`api`/
# `web` are gated behind the `services` profile — bring up the full stack
# with `docker compose --profile services up -d`. All four have their own
# Dockerfile under their respective directory (see docs/DEPLOYMENT.md).

name: job-hunter

services:
  redis:
    image: redis:7-alpine
    container_name: jh-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  scraper:
    build:
      context: ../services/scraper
    container_name: jh-scraper
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-CHANGE_ME}@host.docker.internal:5432/jobhunter?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports:
      - '8001:8001'
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    profiles: ['services'] # start with: docker compose --profile services up

  llm:
    build:
      context: ../services/llm
    container_name: jh-llm
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-CHANGE_ME}@host.docker.internal:5432/jobhunter?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - '8002:8002'
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    profiles: ['services']

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: jh-api
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-CHANGE_ME}@host.docker.internal:5432/jobhunter?sslmode=disable
      SCRAPER_BASE_URL: http://scraper:8001
      LLM_BASE_URL: http://llm:8002
    ports:
      - '4000:4000'
    depends_on:
      - scraper
      - llm
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    profiles: ['services']

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: jh-web
    restart: unless-stopped
    environment:
      API_URL: http://api:4000/v1
      NEXT_PUBLIC_API_URL: http://localhost:4000/v1
    ports:
      - '3000:3000'
    depends_on:
      - api
    profiles: ['services']

volumes:
  redis-data:
