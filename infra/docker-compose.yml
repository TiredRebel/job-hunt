# Job Hunter — local infra
#
# NOT started here (already running on this machine):
#   - Postgres 17: container `pg-learn` @ localhost:5432  → create database `jobhunter` in it
#   - n8n:         container `n8n-n8n-1` @ localhost:5678
#
# This file adds only what's missing. Services connect to the host's
# Postgres/n8n via host.docker.internal.
#
# `redis` starts by default (`docker compose up -d`). `scraper`/`llm`/`api`/
# `web` are gated behind the `services` profile — bring up the full stack
# with `docker compose --profile services up -d`. All four have their own
# Dockerfile under their respective directory (see docs/DEPLOYMENT.md).
#
# POSTGRES_USER/POSTGRES_PASSWORD below are read from `infra/.env` (copy
# from infra/.env.example) — Compose auto-loads a `.env` from the same
# directory as this file for `${...}` substitution; it does NOT read the
# repo-root `.env` for that purpose (repo-root `.env` only reaches
# containers via each service's `env_file: ../.env`, which is a different,
# runtime-only mechanism). Keep the value in sync with the repo-root
# `.env`'s `DATABASE_URL` credentials.

name: job-hunter

services:
  redis:
    image: redis:7-alpine
    container_name: jh-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  scraper:
    build:
      context: ../services/scraper
    container_name: jh-scraper
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-CHANGE_ME}@host.docker.internal:5432/jobhunter?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports:
      - '8001:8001'
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    profiles: ['services'] # start with: docker compose --profile services up

  llm:
    build:
      context: ../services/llm
    container_name: jh-llm
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-CHANGE_ME}@host.docker.internal:5432/jobhunter?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - '8002:8002'
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    profiles: ['services']

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: jh-api
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-CHANGE_ME}@host.docker.internal:5432/jobhunter?sslmode=disable
      SCRAPER_BASE_URL: http://scraper:8001
      LLM_BASE_URL: http://llm:8002
      # CORS fallback for browsers hitting the gateway directly (the normal
      # path is same-origin via the web app's /api proxy, where CORS never
      # applies). Comma-separated list of allowed browser origins; :3100
      # covers a local `next dev` while :3000 is held by the web container.
      WEB_ORIGIN: http://localhost:3000,http://localhost:3100
    ports:
      - '4000:4000'
    depends_on:
      - scraper
      - llm
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    profiles: ['services']

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: jh-web
    restart: unless-stopped
    # For TRUST_PROXY_HEADERS (the web-side X-Forwarded-For trust gate) —
    # same repo-root .env the other three services already read this way,
    # so one file is the source of truth for both this and the gateway's
    # own TRUST_PROXY_HEADERS. Everything below overrides the container-
    # network-specific values env_file would otherwise get wrong.
    env_file: ../.env
    environment:
      # Read live at runtime by Server Components AND the /api proxy route
      # that browser fetches go through — no browser-facing gateway URL is
      # baked into the image, so no build args are needed here.
      API_URL: http://api:4000/v1
    ports:
      - '3000:3000'
    depends_on:
      - api
    profiles: ['services']

volumes:
  redis-data:
