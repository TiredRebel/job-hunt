# Job Hunter — local infra
#
# NOT started here (already running on this machine):
#   - Postgres 17: container `pg-learn` @ localhost:5432  → create database `jobhunter` in it
#
# This file adds only what's missing. Services reach the existing `pg-learn`
# container over the external `job-hunter-database` Docker network; this avoids
# Docker Desktop's fragile container -> host.docker.internal -> container hop.
#
# `redis` starts by default (`docker compose up -d`). `scraper`/`llm`/`api`/
# `web`/`n8n-db`/`n8n` are gated behind the `services` profile — bring up the
# full stack with `docker compose --profile services up -d`. The n8n pair can
# also be managed independently with `--profile automation`. Application
# services have their own Dockerfile under their respective directory (see
# docs/DEPLOYMENT.md).
#
# POSTGRES_USER/POSTGRES_PASSWORD below are read from `infra/.env` (copy
# from infra/.env.example) — Compose auto-loads a `.env` from the same
# directory as this file for `${...}` substitution; it does NOT read the
# repo-root `.env` for that purpose (repo-root `.env` only reaches
# containers via each service's `env_file: ../.env`, which is a different,
# runtime-only mechanism). Keep the value in sync with the repo-root
# `.env`'s `DATABASE_URL` credentials.

name: job-hunter

services:
  redis:
    image: redis:7-alpine
    container_name: jh-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  scraper:
    build:
      context: ../services/scraper
    container_name: jh-scraper
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-CHANGE_ME}@pg-learn:5432/jobhunter?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports:
      - '8001:8001'
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - default
      - database
    profiles: ['services'] # start with: docker compose --profile services up

  llm:
    build:
      context: ../services/llm
    container_name: jh-llm
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-CHANGE_ME}@pg-learn:5432/jobhunter?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - '8002:8002'
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - default
      - database
    profiles: ['services']

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: jh-api
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-CHANGE_ME}@pg-learn:5432/jobhunter?sslmode=disable
      SCRAPER_BASE_URL: http://scraper:8001
      LLM_BASE_URL: http://llm:8002
      # CORS fallback for browsers hitting the gateway directly (the normal
      # path is same-origin via the web app's /api proxy, where CORS never
      # applies). Comma-separated list of allowed browser origins; :3100
      # covers a local `next dev` while :3000 is held by the web container.
      WEB_ORIGIN: http://localhost:3000,http://localhost:3100
    ports:
      - '4000:4000'
    depends_on:
      scraper:
        condition: service_healthy
      llm:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - default
      - database
    profiles: ['services']

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: jh-web
    restart: unless-stopped
    # For TRUST_PROXY_HEADERS (the web-side X-Forwarded-For trust gate) —
    # same repo-root .env the other three services already read this way,
    # so one file is the source of truth for both this and the gateway's
    # own TRUST_PROXY_HEADERS. Everything below overrides the container-
    # network-specific values env_file would otherwise get wrong.
    env_file: ../.env
    environment:
      # Read live at runtime by Server Components AND the /api proxy route
      # that browser fetches go through — no browser-facing gateway URL is
      # baked into the image, so no build args are needed here.
      API_URL: http://api:4000/v1
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/en/jobs').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    profiles: ['services']

  n8n-db:
    image: postgres:16
    container_name: jh-n8n-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:-CHANGE_ME}
    volumes:
      - n8n-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${N8N_DB_USER:-n8n} -d ${N8N_DB_NAME:-n8n}']
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ['services', 'automation']

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-stable}
    container_name: jh-n8n
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-CHANGE_ME}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_USER_FOLDER: /home/node
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Kyiv}
      TZ: ${TZ:-Europe/Kyiv}
      JOB_HUNTER_API_BASE_URL: ${JOB_HUNTER_API_BASE_URL:-http://host.docker.internal:4000/v1}
      JOB_HUNTER_LLM_BASE_URL: ${JOB_HUNTER_LLM_BASE_URL:-http://host.docker.internal:8002}
      SMTP_USER: ${SMTP_USER:-}
    ports:
      - '5678:5678'
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      n8n-db:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    profiles: ['services', 'automation']

volumes:
  redis-data:
  n8n-db-data:
    name: n8n_db_storage
  n8n-data:
    name: n8n_n8n_storage

networks:
  database:
    name: job-hunter-database
    external: true
