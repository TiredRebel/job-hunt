[project]
name = "scraper"
version = "0.1.0"
description = "Scraper service: source adapters, scrape runs, dedup, raw vacancy persistence."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "beautifulsoup4>=4.12",
    "defusedxml>=0.7",
]

[dependency-groups]
dev = [
    "mypy>=1.16",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
    "types-beautifulsoup4>=4.12.0.20250516",
    "types-defusedxml>=0.7.0.20260504",
]
# Optional: rendering fetcher for `crawl4ai`-strategy sources (ADR-006).
# `uv sync --group browser` then `uv run playwright install chromium`.
# The service and every `api`-strategy source work without this group.
browser = [
    "crawl4ai>=0.9,<0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "TID", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"

# Optional dependency (browser group) — not installed by default; the
# fetcher isolates all crawl4ai usage behind lazy imports (see D5 in
# openspec/changes/phase-2-crawl4ai-fetch-ladder/design.md).
[[tool.mypy.overrides]]
module = "crawl4ai.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
