[project]
name = "llm"
version = "0.1.0"
description = "LLM service: provider hub with fallback, LangGraph pipelines (normalize/tag/match/cover-letter)."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "langgraph>=0.4",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "python-json-logger>=3.2",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "mypy>=1.16",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "TID", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "--cov=llm --cov-report=term-missing"

# Coverage is scoped to domain/application logic per CODING_STANDARDS.md
# ("coverage gate >= 80% on domain/application"): route handlers (the real
# request logic per llm.main's own docstring), pipeline orchestration,
# provider resolution/hot-switch, schemas, registry. Excluded as thin
# infrastructure: db.py (DB access glue), main.py (FastAPI app-lifecycle
# wiring only), listener.py (live-Postgres NOTIFY loop), and the concrete
# provider HTTP adapters (real network calls, not decision logic).
[tool.coverage.run]
source = ["src/llm"]
omit = [
    "src/llm/main.py",
    "src/llm/db.py",
    "src/llm/listener.py",
    "src/llm/providers/anthropic.py",
    "src/llm/providers/ollama.py",
    "src/llm/providers/openai_compat.py",
    "src/llm/providers/base.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 95
